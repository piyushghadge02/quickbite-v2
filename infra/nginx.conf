# QuickBite v2 — nginx config for the `web` service.
#
# Serves the Flutter web build (frontend/build/web, produced by the
# frontend track via `flutter build web`) with SPA deep-link fallback:
# any unknown path serves index.html so client-side routing works.
#
# /api/ is reverse-proxied to the api service. This is OPTIONAL — it only
# matters if the Flutter web build uses a relative "/api" base URL (same
# origin, no CORS). If the app points at an absolute API URL instead
# (e.g. http://localhost:8000), delete the location /api/ block.
#
# The interactive API docs live at /docs and /openapi.json on the api
# service (127.0.0.1:8000 by default); they are NOT proxied here on
# purpose — uncomment the location blocks below to expose them.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long cache for Flutter's hashed build assets; never cache index.html.
    map $uri $cache_control {
        default "no-cache";
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: try the file, then the directory, then index.html.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control $cache_control always;
        }

        # Optional: same-origin API proxy for the web build.
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uncomment to expose the FastAPI docs through the web host:
        # location = /docs       { proxy_pass http://api:8000/docs; }
        # location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
    }
}
