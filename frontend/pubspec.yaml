name: quickbite_app
description: QuickBite v2 — food delivery order processing client (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management — Riverpod 2.x. Chosen over Provider/Bloc for this app
  # because: compile-safe providers, easy provider overrides in widget tests,
  # family providers for per-order/per-restaurant state, and no BuildContext
  # plumbing for the polling/checkout logic that lives outside widgets.
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  # Mobile-only. The web build must never import this package: it is only
  # referenced from lib/storage/token_storage_mobile.dart, which is pulled in
  # through a conditional import (dart.library.io).
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
